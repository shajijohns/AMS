server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files and fallback to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy /api requests to backend, useful if hardcoded localhost URLs are changed to relative paths
    location /api/ {
        proxy_pass https://federationapps-api.mangostone-9f65fdbe.eastus.azurecontainerapps.io;
    	proxy_ssl_server_name on;
    	proxy_set_header Host federationapps-api.mangostone-9f65fdbe.eastus.azurecontainerapps.io;
    	proxy_set_header X-Real-IP $remote_addr;
    	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	proxy_set_header X-Forwarded-Proto $scheme;
}
}
