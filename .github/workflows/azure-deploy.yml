name: Build and Deploy Association Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # ============================================================
  # AZURE SETTINGS
  # ============================================================
  AZURE_RESOURCE_GROUP: BBTGrp

  # Azure Container Apps
  AZURE_CONTAINER_APP_NAME_BACKEND: federationapps-api
  AZURE_CONTAINER_APP_NAME_FRONTEND: federationapps-web

  # Azure Container Registry
  ACR_LOGIN_SERVER: federationassocationapplication.azurecr.io

  # Docker image names
  BACKEND_IMAGE_NAME: memberregisteration-backend
  FRONTEND_IMAGE_NAME: memberregisteration-frontend

  # Azure SQL
  AZURE_SQL_SERVER: fedsql-sql1

  # .NET
  DOTNET_VERSION: "9.0.x"


jobs:

  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. LOGIN TO AZURE
      # ============================================================
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ============================================================
      # 3. LOGIN TO AZURE CONTAINER REGISTRY
      # ============================================================
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}


      # ============================================================
      # 4. BUILD BACKEND IMAGE
      # ============================================================
      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE_NAME }}:latest \
            -f src/Backend/Dockerfile \
            .


      # ============================================================
      # 5. PUSH BACKEND IMAGE
      # ============================================================
      - name: Push Backend Image
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE_NAME }}:latest


      # ============================================================
      # 6. BUILD FRONTEND IMAGE
      # ============================================================
      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE_NAME }}:latest \
            -f src/Frontend/Dockerfile \
            src/Frontend


      # ============================================================
      # 7. PUSH FRONTEND IMAGE
      # ============================================================
      - name: Push Frontend Image
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE_NAME }}:latest


      # ============================================================
      # 8. SETUP .NET 9
      # ============================================================
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}


      # ============================================================
      # 9. RESTORE BACKEND PACKAGES
      # ============================================================
      - name: Restore Backend NuGet Packages
        run: |
          dotnet restore src/Backend/Ams.Api/Ams.Api.csproj


      # ============================================================
      # 10. BUILD BACKEND
      # ============================================================
      - name: Build Backend
        run: |
          dotnet build \
            src/Backend/Ams.Api/Ams.Api.csproj \
            --configuration Release \
            --no-restore


      # ============================================================
      # 11. INSTALL EF CORE TOOLS
      # ============================================================
      - name: Install EF Core Tools
        run: |
          dotnet tool install --global dotnet-ef --version "9.*"
          dotnet ef --version


      # ============================================================
      # 12. GET GITHUB RUNNER PUBLIC IP
      #
      # GitHub-hosted runners use dynamic IP addresses.
      # We determine the current runner IP and temporarily allow it
      # through the Azure SQL firewall.
      # ============================================================
      - name: Get GitHub Runner Public IP
        id: runner_ip
        shell: bash
        run: |
          RUNNER_IP=$(curl --fail --silent --show-error https://api.ipify.org)

          if [ -z "$RUNNER_IP" ]; then
            echo "ERROR: Unable to determine GitHub runner public IP."
            exit 1
          fi

          echo "GitHub Runner IP: $RUNNER_IP"
          echo "ipv4=$RUNNER_IP" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 13. ADD GITHUB RUNNER TO AZURE SQL FIREWALL
      # ============================================================
      - name: Add GitHub Runner to Azure SQL Firewall
        run: |
          echo "Adding temporary SQL firewall rule..."

          az sql server firewall-rule create \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --server "${{ env.AZURE_SQL_SERVER }}" \
            --name "GitHubActions-${{ github.run_id }}" \
            --start-ip-address "${{ steps.runner_ip.outputs.ipv4 }}" \
            --end-ip-address "${{ steps.runner_ip.outputs.ipv4 }}"


      # ============================================================
      # 14. WAIT FOR AZURE SQL FIREWALL
      #
      # Give Azure time to propagate the new firewall rule.
      # ============================================================
      - name: Wait for Azure SQL Firewall
        run: |
          echo "Waiting for Azure SQL firewall rule to propagate..."
          sleep 20


      # ============================================================
      # 15. RUN EF CORE MIGRATIONS
      #
      # SQL_CONNECTION_STRING comes from GitHub Actions Secrets.
      #
      # It should point to:
      #
      # Server:
      # fedsql-sql1.database.windows.net
      #
      # Database:
      # AMS
      # ============================================================
      - name: Run EF Core Migrations
        run: |
          dotnet ef database update \
            --project src/Backend/Ams.Infrastructure/Ams.Infrastructure.csproj \
            --startup-project src/Backend/Ams.Api/Ams.Api.csproj \
            --connection "${{ secrets.SQL_CONNECTION_STRING }}"


      # ============================================================
      # 16. REMOVE TEMPORARY SQL FIREWALL RULE
      #
      # This executes even if EF migration fails.
      # ============================================================
      - name: Remove GitHub Runner SQL Firewall Rule
        if: always()
        continue-on-error: true
        run: |
          echo "Removing temporary SQL firewall rule..."

          az sql server firewall-rule delete \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --server "${{ env.AZURE_SQL_SERVER }}" \
            --name "GitHubActions-${{ github.run_id }}" \
            --yes


      # ============================================================
      # 17. DEPLOY BACKEND TO AZURE CONTAINER APPS
      # ============================================================
      - name: Deploy Backend to Azure Container Apps
        run: |
          az containerapp update \
            --name "${{ env.AZURE_CONTAINER_APP_NAME_BACKEND }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.ACR_LOGIN_SERVER }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}"


      # ============================================================
      # 18. DEPLOY FRONTEND TO AZURE CONTAINER APPS
      # ============================================================
      - name: Deploy Frontend to Azure Container Apps
        run: |
          az containerapp update \
            --name "${{ env.AZURE_CONTAINER_APP_NAME_FRONTEND }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.ACR_LOGIN_SERVER }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}"


      # ============================================================
      # 19. SHOW BACKEND DEPLOYMENT STATUS
      # ============================================================
      - name: Show Backend Container App Status
        if: success()
        run: |
          echo "Backend deployment status:"

          az containerapp show \
            --name "${{ env.AZURE_CONTAINER_APP_NAME_BACKEND }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "{Name:name,Revision:properties.latestRevisionName,FQDN:properties.configuration.ingress.fqdn}" \
            --output table


      # ============================================================
      # 20. SHOW FRONTEND DEPLOYMENT STATUS
      # ============================================================
      - name: Show Frontend Container App Status
        if: success()
        run: |
          echo "Frontend deployment status:"

          az containerapp show \
            --name "${{ env.AZURE_CONTAINER_APP_NAME_FRONTEND }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "{Name:name,Revision:properties.latestRevisionName,FQDN:properties.configuration.ingress.fqdn}" \
            --output table
